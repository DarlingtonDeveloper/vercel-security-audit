name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported LTS, the active LTS, and the current release.
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check bundled scripts
        run: for f in skills/vercel-security-audit/scripts/*.mjs; do node --check "$f"; done
      - name: Run tests
        run: node --test 'tests/*.test.mjs'
